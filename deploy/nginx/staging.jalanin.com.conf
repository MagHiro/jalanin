# staging.jalanin.com — HTTP + HTTPS in one file.
# Backend: Next.js standalone behind compose.prod.yml (127.0.0.1:${APP_PORT:-3000}:3000).

server {
    listen 80;
    listen [::]:80;
    server_name staging.jalanin.com;

    # Let's Encrypt HTTP-01 challenge must stay on port 80.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }

    access_log /var/log/nginx/staging.jalanin.com-80-access.log;
    error_log /var/log/nginx/staging.jalanin.com-80-error.log;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name staging.jalanin.com;

    ssl_certificate /etc/letsencrypt/live/staging.jalanin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.jalanin.com/privkey.pem;
    # Recommended TLS hardening (adjust to distro defaults if managed by certbot):
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 443;

        # WebSocket support (Next.js HMR / _next/webpack-hmr on staging)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    access_log /var/log/nginx/staging.jalanin.com-443-access.log;
    error_log /var/log/nginx/staging.jalanin.com-443-error.log;
}
