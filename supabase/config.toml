# Local Supabase CLI development stack configuration.
# Default full local stack: `supabase start` (Dockerized PostgreSQL + Auth +
# Storage). Migrations in ./migrations run against both this stack and hosted
# Supabase projects. Ports mirror the CLI defaults.
project_id = "jalanin"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 16

[db.pooler]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
enable_signup = true
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Password recovery redirects must land back in this app.
additional_redirect_urls = ["http://localhost:3000/**"]

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[storage]
enabled = true
file_size_limit = "5MiB"

[studio]
enabled = true
port = 54323

[mailpit]
enabled = true
port = 8025
