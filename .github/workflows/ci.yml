name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: postgresql://jalanin:jalanin@localhost:54322/jalanin
  E2E_MODE: "1"
  EMAIL_PROVIDER: log

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jalanin
          POSTGRES_PASSWORD: jalanin
          POSTGRES_DB: jalanin
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U jalanin -d jalanin"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:seed:test
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install chromium
      - run: pnpm test:e2e
