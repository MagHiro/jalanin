name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: postgresql://jalanin:local_password@localhost:5432/jalanin
  E2E_MODE: "1"
  EMAIL_PROVIDER: log
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  CRON_SECRET: ci-test-secret
  PRIVATE_UPLOAD_DIR: storage/private
  PUBLIC_UPLOAD_DIR: storage/public

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jalanin
          POSTGRES_PASSWORD: local_password
          POSTGRES_DB: jalanin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jalanin -d jalanin"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:seed:test
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install chromium
      - run: pnpm test:e2e
      - name: Validate production compose config
        run: |
          # Static Compose validation with the full key set (placeholder
          # values). Must cover every :? required variable in
          # compose.prod.yml. Never use or commit real production secrets.
          cat > .env.prod <<'EOF'
          POSTGRES_USER=jalanin
          POSTGRES_PASSWORD=ci-placeholder-not-production
          POSTGRES_DB=jalanin
          DATABASE_URL=postgresql://jalanin:ci-placeholder-not-production@postgres:5432/jalanin
          NEXT_PUBLIC_APP_URL=http://localhost:3000
          NEXT_PUBLIC_TURNSTILE_SITE_KEY=1x00000000000000000000AA
          NEXT_PUBLIC_ANALYTICS_ENABLED=false
          EMAIL_PROVIDER=smtp
          SMTP_HOST=localhost
          SMTP_PORT=1025
          EMAIL_FROM=ci@example.com
          ADMIN_ALERT_EMAIL=ci@example.com
          CRON_SECRET=ci-test-secret
          RATE_LIMIT_PEPPER=ci-test-pepper
          TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA
          EOF
          trap 'rm -f .env.prod' EXIT
          docker compose --env-file .env.prod -f compose.prod.yml config --quiet
