# Local development infrastructure (PostgreSQL + Mailpit).
# The Next.js app itself runs on the host via `pnpm dev` — it is NOT
# containerized here. Production uses compose.prod.yml (app + postgres).
name: jalanin

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jalanin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_password}
      POSTGRES_DB: ${POSTGRES_DB:-jalanin}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jalanin} -d ${POSTGRES_DB:-jalanin}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
    ports:
      - "127.0.0.1:1025:1025" # SMTP (SMTP_HOST/SMTP_PORT)
      - "127.0.0.1:8025:8025" # Web UI for inspecting test emails

volumes:
  pgdata:
